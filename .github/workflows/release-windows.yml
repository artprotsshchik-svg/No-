name: Build & Release Windows App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Test & Build Web + Go Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run sync:data
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Prepare Embedded WebUI & Verify Go Cross-Compile
        run: |
          rm -rf desktop/webui/assets desktop/webui/data desktop/webui/index.html
          cp -r dist/* desktop/webui/
          cd desktop
          go mod tidy
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o /tmp/ModOptimizer-win-x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags cli -ldflags="-s -w" -o /tmp/modopt-cli-win-x64.exe .

  release-windows:
    name: Build Native Windows Binaries (Go + WebView2 + CLI)
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run sync:data
      - run: npm run build

      - name: Build Native Go WebView2 & CLI Executables
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path "dist\*" -Destination "desktop\webui" -Recurse -Force
          Push-Location desktop
          go mod tidy
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $ldGui = "-H windowsgui -s -w -X main.appVersion=$ver -X main.githubRepo=${{ github.repository }}"
          $ldCli = "-s -w -X main.appVersion=$ver -X main.githubRepo=${{ github.repository }}"
          go build -ldflags $ldGui -o "..\release\ModOptimizer-win-x64.exe" .
          go build -tags cli -ldflags $ldCli -o "..\release\modopt-cli-win-x64.exe" .
          Pop-Location

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: mod-optimizer-windows
          path: |
            release/*.exe
            public/data/manifest.json
            public/data/db-bundle.json

      - name: Upload Executables & Hot Data Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" release/ModOptimizer-win-x64.exe release/modopt-cli-win-x64.exe public/data/manifest.json public/data/db-bundle.json --clobber
